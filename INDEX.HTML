<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person 💗</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="home">

    <div class="background-hearts">
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>✦</span>
        <span>♥</span>
        <span>♡</span>
        <span>✦</span>
        <span>♥</span>
    </div>

    <main class="screen">

        <div class="home-card">

            <div class="tiny-flower">🌷</div>

            <p class="eyebrow">
                TO THE GIRL WHO HAS MY HEART
            </p>

            <h1>
                Happy<br>
                <span>Monthsary</span> 💗
            </h1>

            <div class="heart-divider">
                ─── ♥ ───
            </div>

            <p class="home-message">
                I made something little for you...
                <br>
                because you deserve something special.
            </p>

            <div class="date-badge">
                ♡ Another month with you ♡
            </div>

            <a href="letter.html" class="main-button">
                Open Your Surprise
                <span>→</span>
            </a>

            <p class="bottom-note">
                made with love, just for you ♡
            </p>

        </div>

    </main>

    <button class="music-button" id="musicButton">
        ♪
    </button>

    <audio id="music" loop>
        <source src="music/bg.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>

</body>
</html>
